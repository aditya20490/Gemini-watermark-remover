<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <meta name="theme-color" content="#0d0d10" />

  <title>Heal Tool</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="app-header">
    <div class="header-row">

      <div class="logo">
        <span class="logo-dot"></span>
        <h1>Heal</h1>
      </div>

      <button
        id="themeToggle"
        class="icon-btn"
        aria-label="Toggle theme"
      >
        <span class="theme-icon-dark">🌙</span>
        <span class="theme-icon-light">☀️</span>
      </button>

    </div>

    <p class="tagline">
      Remove unwanted objects directly in your browser.
    </p>
  </header>


  <main>

    <section id="emptyState" class="empty-state">

      <div class="empty-icon">🩹</div>

      <h2>No image yet</h2>

      <p>
        Upload up to 20 photos and heal unwanted spots,
        marks, text, or objects.
      </p>

      <button
        id="uploadBtn"
        class="btn btn-primary"
      >
        📁 Upload Images
      </button>

    </section>


    <section
      id="workspace"
      class="workspace hidden"
    >

      <div class="mode-switch">

        <button
          id="modePredefined"
          class="mode-btn active"
        >
          Predefined
        </button>

        <button
          id="modeDoodle"
          class="mode-btn"
        >
          Doodle
        </button>

      </div>


      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>


      <div
        id="bulkStatus"
        class="bulk-status hidden"
      ></div>


      <div
        id="brushRow"
        class="brush-row hidden"
      >

        <label for="brush">
          Brush
        </label>

        <input
          type="range"
          id="brush"
          min="5"
          max="80"
          value="25"
        />

      </div>


      <div class="button-row">

        <button
          id="generate"
          class="btn btn-accent"
        >
          ✨ Generate
        </button>

        <button
          id="download"
          class="btn"
        >
          ⬇️ Save WebP
        </button>

        <button
          id="reset"
          class="btn btn-ghost"
        >
          ↺ Reset
        </button>

      </div>

    </section>

  </main>


  <footer class="app-footer">
    Runs 100% in your browser · No upload · No tracking
  </footer>


  <input
    id="upload"
    type="file"
    accept="image/png,image/jpeg,image/webp"
    multiple
    hidden
  />


  <script src="inpaint.js"></script>
  <script src="app.js"></script>

</body>
</html>
